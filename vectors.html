<script type="text/javascript">

let canvas = document.querySelector("canvas");
let ctx = canvas.getContext("2d");

let cellsize = 20;

let cols, rows;


function vector(x0,y0,x1,y1,color="yellow",lw=2){
  ctx.beginPath();
  ctx.moveTo((Math.floor(cols/2) + x0)*cellsize, (Math.floor(rows/2) - y0)*cellsize);
  ctx.lineTo((Math.floor(cols/2) + x1)*cellsize, (Math.floor(rows/2) - y1)*cellsize);
  ctx.lineWidth = lw;
  ctx.strokeStyle = color;
  ctx.stroke();
}

function circle(x0, y0, color="white"){
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc((Math.floor(cols/2) + x0)*cellsize, (Math.floor(rows/2) - y0)*cellsize, 4, 0, 2* Math.PI);
  ctx.fill();
}
  
function v(x, y, color="yellow",lw=2){
  vector(0,0,x,y,color,lw);
  circle(x,y, color);
}

//setTimeout(init, 100);
window.onload = init;

let matrix = [[2, 1],
              [0, 1]];

console.log("matrix",matrix);
function um(e){
  cl("e",e.target.value);
  if(e.target.classList.contains("m00")){
    matrix[0][0] = e.target.value;
  }
  else
  if(e.target.classList.contains("m01")){
    matrix[0][1] = eval(e.target.value);
  }
  else
  if(e.target.classList.contains("m10")){
    matrix[1][0] = eval(e.target.value);
  }
  else
  if(e.target.classList.contains("m11")){
    matrix[1][1] = eval(e.target.value);
  }

  cl(matrix);
}
  
let toggle = false;
window.onclick = function(){
  
  if(!toggle){
    toggle = true;
    canvas.style.transform=`matrix(${matrix[0][0]},${-matrix[1][0]},${-matrix[0][1]},${matrix[1][1]},1,1)`;
  }else{
    toggle = false;
    canvas.style.transform="none";
  }
  
}

let consoleel = document.querySelector(".console");

function cl(val){
  consoleel.innerHTML = ""+val;
}
